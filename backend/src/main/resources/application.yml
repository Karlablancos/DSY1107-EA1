spring:
  application:
    name: backend-gastos

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  # ---------------------------------------------------------------------------
  # conexión a RabbitMQ
  # En local apunta al contenedor de docker-compose.yml (guest/guest).
  # En la nube los valores llegan por variables de entorno.
  # ---------------------------------------------------------------------------
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    # Si un mensaje no llega a ninguna cola, Rabbit lo DEVUELVE en vez de
    # botarlo en silencio. Las dos líneas van juntas.
    publisher-returns: true
    template:
      mandatory: true

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false
  # ---------------------------------------------------------------------------
  # NUEVO: la salud del backend NO depende de RabbitMQ.
  # Publicar eventos es "mejor esfuerzo": si el broker no está, el gasto igual
  # se guarda y el error queda en el log. Marcar el backend como DOWN haría que
  # ECS lo reiniciara en bucle (su health check consulta /actuator/health).
  # ---------------------------------------------------------------------------
  health:
    rabbit:
      enabled: false

logging:
  level:
    cl.duoc.dsy1107: DEBUG

# -----------------------------------------------------------------------------
# nombres de mensajería CENTRALIZADOS.
# Ninguna clase Java escribe estos textos a mano: todas los leen desde aquí.
# -----------------------------------------------------------------------------
mensajeria:
  exchange: gastos.exchange
  routing-keys:
    gasto-creado: gasto.creado
    gasto-resuelto: gasto.resuelto