services:
  rabbitmq:
    image: public.ecr.aws/docker/library/rabbitmq:4-management
    container_name: dsy1107-rabbitmq
    ports:
      - "5672:5672"     # AMQP: por aquí se conectan los microservicios
      - "15672:15672"   # panel web (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10